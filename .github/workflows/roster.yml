name: Build Rosters

on:
  push:
    branches: [ main, feat/** ]
    paths-ignore:
      - "out/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "out/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: roster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rosters:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build roster
        shell: bash
        run: |
          set -euo pipefail
          python -u -m src.main \
            --event-signups data/event_signups_next.csv \
            --out out

      - name: Mirror roster output to docs/out
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/out
          rsync -a --delete out/ docs/out/

      - name: Rebuild event results index (SSOT) + mirror DS results to docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          results_dir = Path("data/event_results")
          docs_dir = Path("docs/data/event_results")
          docs_dir.mkdir(parents=True, exist_ok=True)

          pattern = re.compile(r"DS-\d{4}-\d{2}-\d{2}$")

          # Collect IDs from SSOT filenames
          event_ids = []
          for path in results_dir.glob("DS-*.json"):
            if pattern.fullmatch(path.stem):
              event_ids.append(path.stem)

          if not event_ids:
            raise SystemExit("No event result files found to index (data/event_results/DS-*.json).")

          event_ids.sort(reverse=True)
          index_obj = {"event_ids": event_ids}
          index_text = json.dumps(index_obj, indent=2, ensure_ascii=False) + "\n"

          # Mirror DS-*.json from SSOT -> docs (only when different)
          mirrored = 0
          for src in results_dir.glob("DS-*.json"):
            if not pattern.fullmatch(src.stem):
              continue
            dst = docs_dir / src.name
            if not dst.exists() or src.read_bytes() != dst.read_bytes():
              shutil.copy2(src, dst)
              mirrored += 1

          # Write both indexes deterministically
          (results_dir / "index.json").write_text(index_text, encoding="utf-8")
          (docs_dir / "index.json").write_text(index_text, encoding="utf-8")

          # Basic sanity check (helps debugging in Actions logs)
          missing_in_docs = [eid for eid in event_ids if not (docs_dir / f"{eid}.json").exists()]
          if missing_in_docs:
            raise SystemExit(f"Mirror sanity check failed; missing in docs: {missing_in_docs}")

          print(f"Indexed {len(event_ids)} events. Mirrored {mirrored} DS result files into docs/.")
          PY

      - name: Commit generated files (main only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage: roster outputs + event-results index + mirrored docs event results
          git add out/ docs/out/ data/event_results/index.json docs/data/event_results/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "ci: rebuild roster outputs + event results index"

          # Push with simple rebase retry to avoid conflicts on busy main
          for attempt in 1 2 3; do
            if git push; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "Push failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Push attempt ${attempt} failed; rebasing onto latest origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
          done
